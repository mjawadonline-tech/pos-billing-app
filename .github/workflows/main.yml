name: Build Windows EXE with Custom Icon

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build EXE with PyInstaller and Icon
      run: |
        pyinstaller --onefile --windowed --icon=logo.ico --name="POS_Software" billing_app.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: POS-Software-With-Icon
        path: dist/POS_Software.exe
